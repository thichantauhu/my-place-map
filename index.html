<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Place Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>📍 My Place Map</h1>
        <p>Lưu những nơi muốn ăn, chơi và ghé lại.</p>
      </div>
      <button id="locateBtn" class="secondary">📍 Vị trí của tôi</button>
    </header>

    <section class="controls">
      <button class="chip active" data-filter="all">Tất cả</button>
      <button class="chip" data-filter="food">🍜 Ăn uống</button>
      <button class="chip" data-filter="fun">🎮 Vui chơi</button>
      <button class="chip" data-filter="cafe">☕ Cafe</button>
      <button class="chip" data-filter="want">❤️ Muốn đi</button>
      <button id="addBtn" class="primary">＋ Thêm địa điểm</button>
    </section>

    <section class="map-shell">
      <div id="map" class="map">
        <div class="map-grid"></div>
        <div id="userPin" class="user-pin hidden">●</div>
        <div id="markers"></div>
        <div id="mapHint" class="map-hint">Bản đồ sẽ hiển thị tại đây. Bấm “Vị trí của tôi” để định vị.</div>
      </div>
    </section>

    <section class="nearby-head">
      <div>
        <h2>Địa điểm gần bạn</h2>
        <span id="countText">0 địa điểm</span>
      </div>
      <select id="radiusSelect" aria-label="Khoảng cách">
        <option value="1">Trong 1 km</option>
        <option value="3" selected>Trong 3 km</option>
        <option value="5">Trong 5 km</option>
        <option value="10">Trong 10 km</option>
        <option value="999">Tất cả</option>
      </select>
    </section>

    <section id="placeList" class="place-list"></section>

    <dialog id="placeDialog">
      <form method="dialog" id="placeForm" class="form">
        <div class="dialog-head">
          <h3>Thêm địa điểm</h3>
          <button value="cancel" class="icon-btn" aria-label="Đóng">✕</button>
        </div>
        <label>Tên địa điểm<input id="nameInput" required maxlength="100" placeholder="Ví dụ: Quán bún bò..." /></label>
        <label>Loại<select id="categoryInput">
          <option value="food">🍜 Ăn uống</option>
          <option value="fun">🎮 Vui chơi</option>
          <option value="cafe">☕ Cafe</option>
          <option value="other">📌 Khác</option>
        </select></label>
        <label>Ghi chú<textarea id="noteInput" rows="3" maxlength="300" placeholder="Món ngon, giá, giờ mở cửa..." ></textarea></label>
        <label>Vĩ độ<input id="latInput" type="number" step="any" placeholder="Nhập hoặc dùng vị trí hiện tại" /></label>
        <label>Kinh độ<input id="lngInput" type="number" step="any" placeholder="Nhập hoặc dùng vị trí hiện tại" /></label>
        <label class="check"><input id="wantInput" type="checkbox" /> ❤️ Muốn đi</label>
        <div class="form-actions">
          <button value="cancel" class="secondary">Hủy</button>
          <button id="saveBtn" value="default" class="primary">Lưu địa điểm</button>
        </div>
        <p id="formError" class="error"></p>
      </form>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
